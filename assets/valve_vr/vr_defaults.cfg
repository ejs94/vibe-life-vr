// Vibe-Life VR runtime defaults.
//
// autoexec.cfg loads this file once with `exec vr_defaults.cfg`. Keep it short
// and versioned: it is the only place where the shipped defaults live, and it
// must not depend on a cvar being archived in config.cfg.

// Resolve viewmodels from models/native/<legacy-basename>.mdl. The client
// falls back to the legacy model whenever the native file is missing or
// invalid, so this is safe on a partial deploy.
vr_native_weapons 1

// Comfort baseline for a playable build. These used to be pushed from the
// Quest VR Settings screen; that screen is deferred until the build is
// playable, so the shipped defaults live here instead.
vr_smoothturn 0
vr_snap_angle 45
