map crossfire
wait 200
sv_cheats 1
give weapon_9mmhandgun
give weapon_crossbow
vr_test_hands 1
vr_test_hand_pitch 0
vr_test_hand_yaw 0
vr_hands_always_visible 1
vr_offhand_render 0
vr_finger_curling 1
vr_test_finger_curl 1
vr_hand_profile rimrook
vr_hand_pose_source 0
vr_test_camera_fov 70
vr_test_camera_target 0
vr_test_camera_distance 28
vr_test_camera_aim 4

// Hand alone: Rimrook quality reference, no weapon.
use weapon_9mmhandgun
wait 100
r_drawviewmodel 0
vr_test_camera_target 1
vr_test_camera_distance 18
vr_test_camera_aim 0
vr_test_camera 1
wait 30
vr_dumpeye rimrook_hand_lat.ppm
wait 12
vr_test_camera 4
wait 30
vr_dumpeye rimrook_hand_left.ppm
wait 12
vr_test_camera 2
wait 30
vr_dumpeye rimrook_hand_top.ppm
wait 12

// On the Glock: position-only lock.
r_drawviewmodel 1
vr_hide_arms 2
vr_hand_grip_lock 1
vr_test_camera_target 0
vr_test_camera_distance 28
vr_test_camera_aim 4
vr_test_camera 1
wait 30
vr_dumpeye rimrook_glock_lock1_lat.ppm
wait 12
vr_test_camera 2
wait 30
vr_dumpeye rimrook_glock_lock1_top.ppm
wait 12

// On the Glock: full baked orientation.
vr_hand_grip_lock 2
vr_test_camera 1
wait 30
vr_dumpeye rimrook_glock_lock2_lat.ppm
wait 12
vr_test_camera 2
wait 30
vr_dumpeye rimrook_glock_lock2_top.ppm
wait 12

// Baked baseline.
vr_hand_grip_lock 1
vr_hide_arms 0
vr_test_camera 1
wait 30
vr_dumpeye rimrook_glock_baked_lat.ppm
wait 12
vr_test_camera 2
wait 30
vr_dumpeye rimrook_glock_baked_top.ppm
wait 12

vr_test_camera 0
r_drawviewmodel 1
vr_hide_arms 1
vr_hand_profile rimrook
vr_hand_grip_lock 1
vr_test_hands 0
wait 20
quit
