// ==============================================================================
// Xash3D VR - Automated Head Motion & Weapon Laser Sight Simulation Script
// ==============================================================================
// Tests 6DoF head orientation (pitch, yaw, roll) with singularity-free
// quaternion view matrices, dominant-hand weapon viewmodel, and laser sight.
// ==============================================================================

wait 90

echo "=========================================================="
echo "  [VR SIMULATION] Starting Head Motion & Weapons Test...  "
echo "=========================================================="

// Equip player
god
impulse 101
give item_suit
give weapon_9mmAR
give weapon_shotgun
give weapon_357

// Enable hand and laser simulation
vr_test_hands 1
vr_lasersight 1
vr_test_hand_pitch 0
vr_test_hand_yaw 0

// Enable simulated head motion
vr_test_head 1
vr_test_head_pitch 0
vr_test_head_yaw 0
vr_test_head_roll 0

use weapon_9mmAR
wait 60

// 1. Level Head Pose (Pitch 0, Yaw 0, Roll 0)
echo "[VR SIMULATION] Step 1: Level Head Pose (0, 0, 0)..."
vr_dumpeye sim_head_01_level.ppm
wait 25

// 2. Head Roll Left (-25 degrees) - Validates singularity-free rotation
echo "[VR SIMULATION] Step 2: Head Roll Left (-25 deg)..."
vr_test_head_roll -25
wait 30
vr_dumpeye sim_head_02_roll_left.ppm
wait 25

// 3. Head Roll Right (+25 degrees)
echo "[VR SIMULATION] Step 3: Head Roll Right (+25 deg)..."
vr_test_head_roll 25
wait 30
vr_dumpeye sim_head_03_roll_right.ppm
wait 25

// 4. Head Pitch Up (-30 degrees, looking at ceiling)
echo "[VR SIMULATION] Step 4: Head Pitch Up (-30 deg)..."
vr_test_head_roll 0
vr_test_head_pitch -30
wait 30
vr_dumpeye sim_head_04_pitch_up.ppm
wait 25

// 5. Head Pitch Down (+30 degrees, looking at floor)
echo "[VR SIMULATION] Step 5: Head Pitch Down (+30 deg)..."
vr_test_head_pitch 30
wait 30
vr_dumpeye sim_head_05_pitch_down.ppm
wait 25

// 6. Compound 6DoF Motion: Yaw 45 deg + Roll 15 deg + Pitch -10 deg
echo "[VR SIMULATION] Step 6: Compound Motion (Yaw 45, Roll 15, Pitch -10)..."
vr_test_head_yaw 45
vr_test_head_roll 15
vr_test_head_pitch -10
wait 30
vr_dumpeye sim_head_06_compound.ppm
wait 25

// 7. Reset head and test Shotgun with dominant hand aiming
echo "[VR SIMULATION] Step 7: Shotgun Dominant Hand Aim..."
vr_test_head_yaw 0
vr_test_head_roll 0
vr_test_head_pitch 0
use weapon_shotgun
wait 60
vr_dumpeye sim_head_07_shotgun.ppm
wait 25

echo "=========================================================="
echo "  [VR SIMULATION] Head Motion & Weapons Test Complete!    "
echo "=========================================================="
