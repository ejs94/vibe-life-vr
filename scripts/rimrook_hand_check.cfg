// ==============================================================================
// Rimrook hand render check
// Shows the 6DoF hand layer, dumps the open hand, then forces the simulated
// trigger/grip/thumb inputs so R_StudioApplyFingerCurling bends the fingers,
// and dumps again.
// ==============================================================================

echo "=== RIMROOK HAND RENDER CHECK ==="

// Keep the same map viewpoint for both dumps so the frames are comparable.
vr_test_hands 1
vr_offhand_render 1
vr_finger_curling 1
vr_test_hand_pitch -5
vr_test_hand_yaw -10
vr_test_finger_curl 0

wait 40
vr_dumpeye rimrook_hands_open.ppm

// Force trigger/grip/thumb so the procedural curling engages.
vr_test_finger_curl 1
wait 40
vr_dumpeye rimrook_hands_curl.ppm

vr_test_finger_curl 0
wait 10
quit
