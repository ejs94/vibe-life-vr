map crossfire
wait 200
sv_cheats 1
give weapon_9mmhandgun
give weapon_crossbow
vr_test_hands 1
vr_test_hand_pitch 0
vr_test_hand_yaw 0
vr_hands_always_visible 1
vr_offhand_render 1
vr_finger_curling 1
vr_test_finger_curl 1
vr_hand_profile auto
vr_hide_arms 0
vr_test_camera_fov 70
vr_test_camera_target 0
vr_test_camera_distance 28
vr_test_camera_aim 4

// Default: baked Glock hand, MMOD offhand fallback.
use weapon_9mmhandgun
wait 120
vr_hide_arms 0
vr_test_camera 1
wait 30
vr_dumpeye mmod_float_glock_hide0_lat.ppm
wait 12
vr_test_camera 2
wait 30
vr_dumpeye mmod_float_glock_hide0_top.ppm
wait 12

// Debug replacement: MMOD grip hand at the Glock grip.
vr_hide_arms 2
vr_hand_grip_lock 2
vr_test_camera 1
wait 30
vr_dumpeye mmod_float_glock_hide2_lat.ppm
wait 12
vr_test_camera 2
wait 30
vr_dumpeye mmod_float_glock_hide2_top.ppm
wait 12

// Crossbow: baked hands by default.
use weapon_crossbow
wait 120
vr_hide_arms 0
vr_test_camera 1
wait 30
vr_dumpeye mmod_float_crossbow_hide0_lat.ppm
wait 12
vr_test_camera 2
wait 30
vr_dumpeye mmod_float_crossbow_hide0_top.ppm
wait 12

// Crossbow debug replacement: MMOD grip + MMOD support.
vr_hide_arms 2
vr_hand_grip_lock 2
vr_test_offhand_grip 1
vr_twohanded 1
vr_test_camera 1
wait 30
vr_dumpeye mmod_float_crossbow_hide2_lat.ppm
wait 12
vr_test_camera 2
wait 30
vr_dumpeye mmod_float_crossbow_hide2_top.ppm
wait 12

vr_test_camera 0
vr_twohanded 0
vr_test_offhand_grip 0
vr_hide_arms 0
vr_hand_grip_lock 1
vr_hand_profile auto
vr_test_hands 0
wait 20
quit
