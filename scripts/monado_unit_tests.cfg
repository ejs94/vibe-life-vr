// ==============================================================================
// Xash3D VR - Monado Comprehensive VR Unit Test Suite
// Exercises and asserts 100% of implemented VR subsystems in Monado simulation
// ==============================================================================

snd_mute_losefocus 0
wait 60

// Visual capture mode: deterministic weapon/hand framing for image review.
vr_weapon_pullback 0
vr_weapon_true_depth 0

vr_grip_probe 1

echo "=========================================================="
echo "  [MONADO UNIT TEST] Phase 1: OpenXR CVars & Defaults     "
echo "=========================================================="

vr_smoothturn
vr_snap_angle
vr_walkdirection
vr_lasersight
vr_headtorch
vr_twohanded
vr_lefthanded
vr_haptics_enabled
vr_pointer_hud
vr_weapon_pitchadjust
vr_worldscale
vr_height_adjust
vr_menu_distance
vr_menu_scale
vr_audio_hrtf
vr_physical_crouch

wait 20

echo "=========================================================="
echo "  [MONADO UNIT TEST] Phase 2: In-Headset Menu & Lasers    "
echo "=========================================================="

menu_vr
wait 35
// Tab 0: Locomotion & Comfort
vr_menu_tab 0
wait 15
vr_dumpeye unit_01_menu_vr.ppm
wait 10

// Tab 1: Weapons & Combat
vr_menu_tab 1
wait 15
vr_dumpeye unit_01b_tab_weapons.ppm
wait 10

// Tab 2: Immersion, Presence & Audio
vr_menu_tab 2
wait 15
vr_dumpeye unit_01c_tab_presence.ppm
wait 10

// Tab 3: VR Diagnostics & Runtime Debug
vr_menu_tab 3
wait 15
vr_dumpeye unit_01d_menu_vr_debug.ppm
wait 10
vr_menu_tab 0
wait 10

vr_test_hands 1
vr_pointer_hud 1
vr_test_hand_pitch -5
vr_test_hand_yaw -10
wait 15

// Right hand pointer click in menu
vr_test_click 1
wait 15
vr_dumpeye unit_02_beatsaber_right.ppm
wait 10
vr_test_click 0
wait 15

// Left hand pointer click in menu (Beat Saber alternate)
vr_test_click 2
wait 15
vr_dumpeye unit_03_beatsaber_left.ppm
wait 10
vr_test_click 0
wait 20

echo "=========================================================="
echo "  [MONADO UNIT TEST] Phase 3: Level Load & Player Spawn   "
echo "=========================================================="

map c1a0
wait 90

god
give item_suit
give weapon_9mmAR
give weapon_shotgun
give weapon_crossbow
give weapon_rpg
give weapon_handgrenade
give weapon_tripmine
give weapon_snark
give weapon_9mmhandgun
wait 30

vr_test_hands 1
vr_lasersight 1

// Controller menu button pause path: open the in-game menu, dump the quad,
// then close it again. This is the path used when the player pauses the game.
echo "[MONADO UNIT TEST] Testing controller menu button pause menu..."
// Look 90 degrees to the side so the quad-anchor math is exercised for a
// non-zero heading. The panel must still face the player.
vr_test_head 1
vr_test_head_pitch 0
vr_test_head_yaw 90
wait 15
vr_test_btn_menu 1
wait 15
vr_test_btn_menu 0
wait 45
vr_dumpeye unit_00_menu_button.ppm
wait 15
vr_test_btn_menu 1
wait 15
vr_test_btn_menu 0
wait 25
vr_test_head 0
wait 10

echo "=========================================================="
echo "  [MONADO UNIT TEST] Phase 4: Head Flashlight Gesture     "
echo "=========================================================="

// Right hand temple click -> toggle flashlight ON
vr_test_headgesture 1
vr_test_click 1
wait 20
vr_dumpeye unit_04_headtorch_on.ppm
wait 10
vr_test_click 0
vr_test_headgesture 0
wait 25

// Left hand temple click -> toggle flashlight OFF
vr_test_headgesture 2
vr_test_click 2
wait 20
vr_dumpeye unit_05_headtorch_off.ppm
wait 10
vr_test_click 0
vr_test_headgesture 0
wait 25

echo "=========================================================="
echo "  [MONADO UNIT TEST] Phase 5: Orthonormal Head Roll Matrix"
echo "=========================================================="

vr_test_head 1
echo "[MONADO UNIT TEST] Head Roll Left (-25 deg)..."
vr_test_head_roll -25
wait 25
vr_dumpeye unit_06_head_roll_left.ppm
wait 15

echo "[MONADO UNIT TEST] Head Roll Right (+25 deg)..."
vr_test_head_roll 25
wait 25
vr_dumpeye unit_07_head_roll_right.ppm
wait 15

vr_test_head_roll 0
wait 15

echo "=========================================================="
echo "  [MONADO UNIT TEST] Phase 6: VR Controller Layout        "
echo "=========================================================="

// Test 1: Right B (Reload)
echo "[MONADO UNIT TEST] Triggering Right B (Reload)..."
vr_debug_reload 1
vr_test_btn_reload 1
wait 15
vr_test_btn_reload 0
wait 20

// Test 2: Primary hand grip + trigger (Alt-Fire)
echo "[MONADO UNIT TEST] Triggering primary grip+trigger (Alt-Fire)..."
use weapon_9mmAR
wait 40
vr_test_btn_altfire 1
wait 15
vr_test_btn_altfire 0
wait 30

// Test 3: Right A (Jump)
echo "[MONADO UNIT TEST] Triggering Right A (Jump)..."
vr_test_btn_jump 1
wait 15
vr_test_btn_jump 0
wait 20

// Test 4: X/Y are unbound. This phase intentionally sends no legacy use or
// button-based flashlight input; the assertion checks those logs stay absent.
echo "[MONADO UNIT TEST] Confirming X/Y are unbound (no legacy use button)..."
wait 20
vr_debug_reload 0

// Test 5: Head-relative locomotion compensation.
// Head at 90 degrees, primary hand at 0 degrees, stick pushed forward. The
// stick vector must be rotated so the player still walks toward +Y (head
// forward) instead of +X (hand forward).
echo "[MONADO UNIT TEST] Testing head-relative locomotion compensation..."
vr_test_hands 1
vr_test_hand_pitch 0
vr_test_hand_yaw 0
vr_test_head 1
vr_test_head_pitch 0
vr_test_head_yaw 90
vr_test_stick_y 1
vr_test_move_probe 1
wait 45
vr_test_stick_y 0
vr_test_move_probe 0
vr_test_head 0
vr_test_hands 0
wait 10

// Test 6: Weapon rotation calibration must not leak into hand presence.
echo "[MONADO UNIT TEST] Testing weapon calibration isolation from hands..."
vr_test_hands 1
vr_test_hand_pitch 10
vr_test_hand_yaw 20
vr_weapon_rolladjust 0
vr_test_hand_angle_probe 1
wait 30
vr_weapon_rolladjust 30
wait 30
vr_test_hand_angle_probe 0
vr_weapon_rolladjust 0
vr_test_hands 0
wait 10

// Test 7: Crowbar flat-screen attack swing must be suppressed in VR.
echo "[MONADO UNIT TEST] Testing crowbar attack animation suppression..."
impulse 101
wait 25
use weapon_crowbar
wait 40
+attack
wait 30
-attack
wait 20

// Test 8: Left-handed layout. The commands stay the same (jump/reload), but
// the physical source moves from Right A/B to Left X/Y.
echo "[MONADO UNIT TEST] Testing left-handed button layout..."
vr_lefthanded 1
vr_debug_reload 1
wait 20
vr_test_btn_reload_left 1
wait 15
vr_test_btn_reload_left 0
wait 20
vr_test_btn_jump_left 1
wait 15
vr_test_btn_jump_left 0
wait 20
vr_debug_reload 0
vr_lefthanded 0
wait 10

// Test 9: Off-hand grip must emit a world-space grab request.
echo "[MONADO UNIT TEST] Testing off-hand grab request..."
vr_test_hands 1
vr_debug_grab 1
vr_test_offhand_grip 1
wait 20
vr_test_offhand_grip 0
vr_debug_grab 0
vr_test_hands 0
wait 10

// Test 10: Crossbow PiP scope. Alt-fire (primary grip+trigger) toggles the
// server-side zoom; the renderer must switch the PiP lens on and off.
echo "[MONADO UNIT TEST] Testing crossbow PiP scope..."
use weapon_crossbow
wait 50
vr_test_btn_altfire 1
wait 15
vr_test_btn_altfire 0
wait 45
vr_dumpeye unit_18_scope.ppm
wait 15
vr_test_btn_altfire 1
wait 15
vr_test_btn_altfire 0
wait 25

// Test 11: Client prediction must publish the VR flag even though the HLSDK
// reuses clientdata vuser slots for ammo/HUD data. Ladder climbing depends on
// the prediction and the server agreeing on is_vr.
echo "[MONADO UNIT TEST] Testing ladder client-prediction VR flag..."
vr_debug_ladder 1
wait 30
vr_debug_ladder 0

echo "=========================================================="
echo "  [MONADO UNIT TEST] Phase 7: Physical Roomscale Crouch   "
echo "=========================================================="

// Simulated physical squat / ducking: head drops 35cm (threshold is 28cm)
echo "[MONADO UNIT TEST] Simulating physical roomscale crouch (headDrop = -0.35m)..."
vr_physical_crouch 1
vr_test_head 1
vr_test_head_drop -0.35
wait 30
vr_dumpeye unit_08_physical_crouch.ppm
wait 15

echo "[MONADO UNIT TEST] Standing back up (headDrop = 0.0m)..."
vr_test_head_drop 0.0
wait 25

echo "=========================================================="
echo "  [MONADO UNIT TEST] Phase 8: 6DoF Weapon Ballistics      "
echo "=========================================================="

// MP5 Primary Attack
echo "[MONADO UNIT TEST] MP5 6DoF Firing..."
use weapon_9mmAR
wait 40
+attack
wait 15
-attack
wait 15
vr_dumpeye unit_09_mp5_muzzle.ppm
wait 15

// Shotgun Double Blast
echo "[MONADO UNIT TEST] Shotgun Double Blast..."
use weapon_shotgun
wait 40
+attack2
wait 15
-attack2
wait 15
vr_dumpeye unit_10_shotgun_muzzle.ppm
wait 15

// Crossbow Bolt
echo "[MONADO UNIT TEST] Crossbow Bolt..."
use weapon_crossbow
wait 40
+attack
wait 15
-attack
wait 15
vr_dumpeye unit_11_crossbow_muzzle.ppm
wait 15

// RPG Rocket Spawn
echo "[MONADO UNIT TEST] RPG Rocket Spawn..."
use weapon_rpg
wait 40
+attack
wait 15
-attack
wait 25
vr_dumpeye unit_12_rpg_muzzle.ppm
wait 15

// Grenade Toss with Hand Momentum
echo "[MONADO UNIT TEST] Hand Grenade Momentum Toss..."
use weapon_handgrenade
wait 40
+attack
wait 45
-attack
wait 25
vr_dumpeye unit_13_grenade_momentum.ppm
wait 15

echo "=========================================================="
echo "  [MONADO UNIT TEST] Phase 9: 6DoF Tripmines & Snarks     "
echo "=========================================================="

// Tripmine 6DoF Placement
echo "[MONADO UNIT TEST] Tripmine 6DoF Placement..."
use weapon_tripmine
wait 40
+attack
wait 15
-attack
wait 25
vr_dumpeye unit_14_tripmine_placed.ppm
wait 15

// Snark 6DoF Toss with Momentum
echo "[MONADO UNIT TEST] Snark 6DoF Toss with Momentum..."
use weapon_snark
wait 40
+attack
wait 15
-attack
wait 25
vr_dumpeye unit_15_snark_tossed.ppm
wait 15

echo "=========================================================="
echo "  [MONADO UNIT TEST] Phase 10: Two-Handed Stabilization   "
echo "=========================================================="

echo "[MONADO UNIT TEST] Two-Handed Weapon Stabilization..."
use weapon_9mmAR
wait 35
vr_twohanded 1
vr_reload_weapon_profiles
wait 25
vr_dumpeye unit_16_twohanded.ppm
wait 15
vr_twohanded 0

// Two-handed foregrip socket: crossbow off-hand palm must snap to the
// foregrip landmark derived from the reference model.
echo "[MONADO UNIT TEST] Two-Handed Crossbow Foregrip Socket..."
vr_test_hands 1
vr_test_offhand_grip 1
vr_offhand_render 1
vr_hide_arms 2
vr_twohanded 1
use weapon_crossbow
wait 60
vr_dumpeye unit_19_crossbow_foregrip.ppm
wait 15
vr_test_offhand_grip 0
vr_twohanded 0
vr_offhand_render 0
vr_hide_arms 1
vr_test_hands 0
wait 15

echo "=========================================================="
echo "  [MONADO UNIT TEST] Phase 11: Dynamic Skeletal Hands     "
echo "=========================================================="

echo "[MONADO UNIT TEST] Skeletal Hands & Finger Curling..."
use weapon_9mmhandgun
wait 35
vr_finger_curling 1
vr_offhand_render 1
vr_test_finger_curl 1
wait 30
vr_dumpeye unit_17_finger_curling.ppm
wait 15
vr_test_finger_curl 0

echo "=========================================================="
echo "  [MONADO UNIT TEST] Phase 11b: Hand Pose Landmarks        "
echo "=========================================================="

echo "[MONADO UNIT TEST] Hand Pose Landmarks & Handedness Swap..."
vr_hide_arms 2
vr_offhand_render 1
vr_hands_always_visible 1
vr_finger_curling 0
vr_lefthanded 0
vr_test_hands 1
vr_test_hand_pitch 0
vr_test_hand_yaw 0
vr_debug_hand_pose 1
wait 50
vr_dumpeye unit_17b_hand_pose_right.ppm
wait 15
vr_lefthanded 1
wait 50
vr_dumpeye unit_17c_hand_pose_left.ppm
wait 15
vr_debug_hand_pose 0
vr_lefthanded 0
vr_offhand_render 0
vr_finger_curling 1
wait 20

echo "=========================================================="
echo "  [MONADO UNIT TEST] Phase 12: Bullet Impact Debug System "
echo "=========================================================="

echo "[MONADO UNIT TEST] Bullet Impact Visual Markers..."
vr_debug_impacts 1
vr_record_impact 0 0 0 120 0 0 0 0 1
wait 15
vr_clear_impacts
wait 15

echo "=========================================================="
echo "  [MONADO UNIT TEST] ALL MONADO UNIT TEST PHASES COMPLETED"
echo "=========================================================="

// Restore gameplay proximity behavior after the visual captures.
vr_weapon_pullback 1
vr_weapon_true_depth 1

wait 30
quit
