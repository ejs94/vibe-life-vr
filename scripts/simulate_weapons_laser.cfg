// ==============================================================================
// Xash3D VR - Automated Weapon Laser Sight & Aiming Simulation Script
// ==============================================================================
// Tests weapon viewmodel rendering, 3D laser sight projection, weapon switching,
// pitch adjustments (aiming up/down/level), and weapon firing in VR.
// ==============================================================================

// 1. Initial wait to ensure client connection and entity spawn
wait 120

echo "=========================================================="
echo "  [VR SIMULATION] Starting Weapon Laser Sight Test...     "
echo "=========================================================="

// Enable cheats, godmode, full weapons and ammo
god
impulse 101
give item_suit
give weapon_9mmAR
give weapon_shotgun
give weapon_357
give weapon_crossbow

// Enable 6DoF hand simulation and laser sight
vr_test_hands 1
vr_lasersight 1
vr_test_hand_pitch 0
vr_test_hand_yaw 0

// ==============================================================================
// 1. MP5 Submachine Gun (weapon_9mmAR)
// ==============================================================================
echo "[VR SIMULATION] Equipping MP5 Submachine Gun..."
use weapon_9mmAR
wait 75

echo "[VR SIMULATION] MP5 Level Aim with Red Laser Sight..."
vr_dumpeye vr_laser_01_mp5_level.ppm
wait 25

echo "[VR SIMULATION] Aiming MP5 UP (-35 degrees pitch)..."
vr_test_hand_pitch -35
wait 30
vr_dumpeye vr_laser_02_mp5_aim_up.ppm
wait 20

echo "[VR SIMULATION] Firing MP5 burst..."
+attack
wait 25
-attack
wait 20

// ==============================================================================
// 2. Shotgun (weapon_shotgun)
// ==============================================================================
echo "[VR SIMULATION] Switching to Shotgun..."
use weapon_shotgun
vr_test_hand_pitch 0
vr_test_hand_yaw -10
wait 85

echo "[VR SIMULATION] Shotgun Level Aim with Red Laser Sight..."
vr_dumpeye vr_laser_03_shotgun_level.ppm
wait 25

echo "[VR SIMULATION] Aiming Shotgun DOWN (+35 degrees pitch)..."
vr_test_hand_pitch 35
wait 30
vr_dumpeye vr_laser_04_shotgun_aim_down.ppm
wait 20

echo "[VR SIMULATION] Firing Shotgun blast..."
+attack
wait 20
-attack
wait 20

// ==============================================================================
// 3. .357 Magnum Revolver (weapon_357)
// ==============================================================================
echo "[VR SIMULATION] Switching to .357 Magnum Revolver..."
use weapon_357
vr_test_hand_pitch -5
vr_test_hand_yaw 15
wait 75

echo "[VR SIMULATION] .357 Magnum Aiming Right with Laser Sight..."
vr_dumpeye vr_laser_05_revolver_357.ppm
wait 20

echo "[VR SIMULATION] Firing .357 Magnum..."
+attack
wait 20
-attack
wait 25

// ==============================================================================
// 4. Crossbow (weapon_crossbow)
// ==============================================================================
echo "[VR SIMULATION] Switching to Crossbow..."
use weapon_crossbow
vr_test_hand_pitch 0
vr_test_hand_yaw 0
wait 75

echo "[VR SIMULATION] Crossbow Ready with Red Laser Sight..."
vr_dumpeye vr_laser_06_crossbow.ppm
wait 25

echo "=========================================================="
echo "  [VR SIMULATION] Weapon Laser Sight Test Finished!       "
echo "=========================================================="
