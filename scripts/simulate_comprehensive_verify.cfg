// ==============================================================================
// Xash3D VR - Comprehensive Verification Test Script
// ==============================================================================
// Tests all recent implementations:
//   1. 6DoF Head Rotation (Pitch, Yaw, Roll) via Orthonormal Quaternion Matrix
//   2. Dominant-hand viewmodel positioning & 3D laser sight projection
//   3. Floating 2D Menu Quad distance (vr_menu_distance 2.1) & laser cursor
//   4. Multi-weapon arsenal support (MP5, Shotgun, Revolver .357, Crowbar)
//   5. Auto-grant weapons & suit commandline verification
// ==============================================================================

wait 90

echo "=========================================================="
echo "  [VR TEST] Starting Comprehensive Verification Suite...  "
echo "=========================================================="

// 1. Equip player with full arsenal, HEV suit, godmode, and cheats
god
impulse 101
give item_suit
give weapon_9mmAR
give weapon_shotgun
give weapon_357
give weapon_crowbar

// 2. Setup 6DoF hand simulation and dominant-hand laser sight
vr_test_hands 1
vr_lasersight 1
vr_test_hand_pitch 0
vr_test_hand_yaw 0

// 3. Setup 6DoF head simulation
vr_test_head 1
vr_test_head_pitch 0
vr_test_head_yaw 0
vr_test_head_roll 0

// ==============================================================================
// Test 1: Dominant Hand Aiming & Laser Sight Origin (MP5)
// ==============================================================================
echo "[VR TEST] Test 1: MP5 Level Aim - Dominant Hand Centering..."
use weapon_9mmAR
wait 60
vr_dumpeye test_01_mp5_level.ppm
wait 25

// ==============================================================================
// Test 2: Head Roll Left (-25 deg) - Singularity-Free Orthonormal Matrix
// ==============================================================================
echo "[VR TEST] Test 2: Head Roll Left (-25 deg)..."
vr_test_head_roll -25
wait 30
vr_dumpeye test_02_head_roll_left.ppm
wait 25

// ==============================================================================
// Test 3: Head Roll Right (+25 deg) - Optical Axis Stability
// ==============================================================================
echo "[VR TEST] Test 3: Head Roll Right (+25 deg)..."
vr_test_head_roll 25
wait 30
vr_dumpeye test_03_head_roll_right.ppm
wait 25

// ==============================================================================
// Test 4: Head Pitch Up (-35 deg)
// ==============================================================================
echo "[VR TEST] Test 4: Head Pitch Up (-35 deg)..."
vr_test_head_roll 0
vr_test_head_pitch -35
wait 30
vr_dumpeye test_04_head_pitch_up.ppm
wait 25

// ==============================================================================
// Test 5: Head Compound Motion (Yaw 45 deg, Roll 15 deg, Pitch -10 deg)
// ==============================================================================
echo "[VR TEST] Test 5: Compound 6DoF Motion (Yaw 45, Roll 15, Pitch -10)..."
vr_test_head_yaw 45
vr_test_head_roll 15
vr_test_head_pitch -10
wait 30
vr_dumpeye test_05_head_compound.ppm
wait 25

// ==============================================================================
// Test 6: Reset Head and Switch to Shotgun
// ==============================================================================
echo "[VR TEST] Test 6: Shotgun Dominant Hand & Barrel Laser..."
vr_test_head_yaw 0
vr_test_head_roll 0
vr_test_head_pitch 0
use weapon_shotgun
wait 60
vr_dumpeye test_06_shotgun.ppm
wait 25

// ==============================================================================
// Test 7: Revolver .357 Magnum (Handgun Tracking)
// ==============================================================================
echo "[VR TEST] Test 7: Revolver .357 Magnum..."
use weapon_357
wait 60
vr_dumpeye test_07_revolver.ppm
wait 25

// ==============================================================================
// Test 8: Crowbar Melee Viewmodel
// ==============================================================================
echo "[VR TEST] Test 8: Crowbar Melee..."
use weapon_crowbar
wait 60
vr_dumpeye test_08_crowbar.ppm
wait 25

// ==============================================================================
// Test 9: Player Locomotion Append Verification
// ==============================================================================
echo "[VR TEST] Test 9: Testing Locomotion Forward Step..."
+forward
wait 25
-forward
wait 10
vr_dumpeye test_09_locomotion_step.ppm
wait 20

echo "=========================================================="
echo "  [VR TEST] Comprehensive Verification Suite Complete!   "
echo "=========================================================="
