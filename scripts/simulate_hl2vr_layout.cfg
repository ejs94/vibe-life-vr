// Automated regression verification for Half-Life 2: VR Mod controller layout
// Tests: Right A (Reload), Right B (Alt-Fire), Left X (Jump), Left Y (Use/Flashlight), Head gesture

wait 90

echo "=========================================================="
echo "  [HL2VR TEST] Starting HL2VR Controller Layout Test...   "
echo "=========================================================="

// Suit, weapons and ammo
god
impulse 101
give item_suit
give weapon_shotgun
give weapon_9mmAR

// Enable VR simulation
vr_test_hands 1
vr_test_hand_pitch 0
vr_test_hand_yaw 0
vr_lasersight 1

// 1. Equip MP5 (9mmAR) and test Alt-Fire (Right B button -> fires grenade)
use weapon_9mmAR
wait 70

echo "[HL2VR TEST] Testing Right B Alt-Fire on MP5 (Grenade Launcher)..."
vr_test_btn_altfire 1
wait 10
vr_test_btn_altfire 0
wait 30

// 2. Fire some primary bullets then test Reload (Right A button)
echo "[HL2VR TEST] Firing 9mmAR then testing Right A Reload..."
+attack
wait 15
-attack
wait 10
vr_test_btn_reload 1
wait 10
vr_test_btn_reload 0
wait 60

// 3. Test Jump (Left X button)
echo "[HL2VR TEST] Testing Left X Jump..."
vr_test_btn_jump 1
wait 15
vr_test_btn_jump 0
wait 30

// 4. Test Use (Left Y button)
echo "[HL2VR TEST] Testing Left Y Use..."
vr_test_btn_use 1
wait 15
vr_test_btn_use 0
wait 20

// 5. Test Head Flashlight Gesture
echo "[HL2VR TEST] Testing Head Flashlight Gesture..."
vr_test_headgesture 1
vr_test_click 1
wait 15
vr_test_click 0
vr_test_headgesture 0
wait 25

// 6. Test Shotgun Double Blast Alt-Fire (Right B)
use weapon_shotgun
wait 85
echo "[HL2VR TEST] Testing Right B Double Blast on Shotgun..."
vr_test_btn_altfire 1
wait 15
vr_test_btn_altfire 0
wait 40

echo "=========================================================="
echo "  [HL2VR TEST] ALL HL2VR CONTROLLER TESTS COMPLETED!      "
echo "=========================================================="
wait 60
quit
