// Automated regression verification for the VR controller layout
// Tests: Right B (Reload), Right A (Jump), primary grip+trigger (Alt-Fire),
// off-hand trigger (Use), head-tap gesture (Flashlight)

wait 90

echo "=========================================================="
echo "  [HL2VR TEST] Starting HL2VR Controller Layout Test...   "
echo "=========================================================="

// Suit, weapons and ammo
god
impulse 101
give item_suit
give weapon_shotgun
give weapon_9mmAR

// Enable VR simulation
vr_test_hands 1
vr_test_hand_pitch 0
vr_test_hand_yaw 0
vr_lasersight 1

// 1. Equip MP5 (9mmAR) and test Alt-Fire (primary grip+trigger -> grenade)
use weapon_9mmAR
wait 70

echo "[VR TEST] Testing primary grip+trigger Alt-Fire on MP5 (Grenade Launcher)..."
vr_test_btn_altfire 1
wait 10
vr_test_btn_altfire 0
wait 30

// 2. Fire some primary bullets then test Reload (Right B button)
echo "[VR TEST] Firing 9mmAR then testing Right B Reload..."
+attack
wait 15
-attack
wait 10
vr_test_btn_reload 1
wait 10
vr_test_btn_reload 0
wait 60

// 3. Test Jump (Right A button)
echo "[VR TEST] Testing Right A Jump..."
vr_test_btn_jump 1
wait 15
vr_test_btn_jump 0
wait 30

// 4. Test Head Flashlight Gesture
echo "[VR TEST] Testing Head Flashlight Gesture..."
vr_test_headgesture 1
vr_test_click 1
wait 15
vr_test_click 0
vr_test_headgesture 0
wait 25

// 5. Test Shotgun Double Blast Alt-Fire (primary grip+trigger)
use weapon_shotgun
wait 85
echo "[VR TEST] Testing primary grip+trigger Double Blast on Shotgun..."
vr_test_btn_altfire 1
wait 15
vr_test_btn_altfire 0
wait 40

echo "=========================================================="
echo "  [HL2VR TEST] ALL HL2VR CONTROLLER TESTS COMPLETED!      "
echo "=========================================================="
wait 60
quit
