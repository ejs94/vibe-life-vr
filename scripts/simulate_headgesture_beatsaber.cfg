// ==============================================================================
// Xash3D VR - Head Flashlight Gesture & Beat Saber Dual Pointer Test Script
// ==============================================================================

wait 60

echo "=========================================================="
echo "  [VR TEST] Step 1: Beat Saber Dual Laser Pointers in Menu "
echo "=========================================================="

vr_test_hands 1
vr_pointer_hud 1
vr_test_hand_pitch -5
vr_test_hand_yaw -10
wait 20

// 1. Right hand click in menu -> switches active pointer to Right hand
echo "[VR TEST] Right hand trigger click in menu..."
vr_test_click 1
wait 15
vr_dumpeye beatsaber_01_right_click.ppm
wait 10
vr_test_click 0
wait 20

// 2. Left hand click in menu -> switches active pointer to Left hand (Beat Saber style)
echo "[VR TEST] Left hand trigger click in menu (alternates pointer)..."
vr_test_click 2
wait 15
vr_dumpeye beatsaber_02_left_click.ppm
wait 10
vr_test_click 0
wait 20

echo "=========================================================="
echo "  [VR TEST] Step 2: Head-Mounted Flashlight & Head Gesture"
echo "=========================================================="

// Load map to test head-mounted flashlight and gesture in 3D
map c1a0
wait 90
god
impulse 101
give item_suit
wait 20

vr_test_hands 1
vr_lasersight 1

// Verify headtorch is active (following cl.viewangles)
echo "[VR TEST] Headtorch CVar value:"
vr_headtorch

// 3. Right hand reaches to temple/ear and clicks -> toggles flashlight ON
echo "[VR TEST] Right hand head gesture click (toggles flashlight ON)..."
vr_test_headgesture 1
vr_test_click 1
wait 15
vr_dumpeye headtorch_01_gesture_on.ppm
wait 10
vr_test_click 0
vr_test_headgesture 0
wait 30

// 4. Left hand reaches to temple/ear and clicks -> toggles flashlight OFF
echo "[VR TEST] Left hand head gesture click (toggles flashlight OFF)..."
vr_test_headgesture 2
vr_test_click 2
wait 15
vr_dumpeye headtorch_02_gesture_off.ppm
wait 10
vr_test_click 0
vr_test_headgesture 0
wait 30

echo "=========================================================="
echo "  [VR TEST] Test Complete!                                "
echo "=========================================================="
