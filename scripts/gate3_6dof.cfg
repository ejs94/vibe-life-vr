map crossfire
wait 200
sv_cheats 1
give weapon_crossbow
use weapon_crossbow
wait 150
vr_test_hands 1
vr_test_hand_pitch 0
vr_test_hand_yaw 0
vr_hide_arms 2
vr_hands_always_visible 1
vr_offhand_render 1
vr_finger_curling 1
vr_test_finger_curl 1
vr_hand_profile provided
vr_primary_hand_model "models/v_hand_mmod.mdl"
vr_offhand_hand_model "models/v_hand_mmod.mdl"
vr_hand_grip_lock 2
vr_hand_pose_source 1
vr_hand_anim_blend 1.0
vr_test_camera_fov 60
vr_test_camera_target 1

vr_hand_input_curl 0.0
vr_test_camera_distance 14
vr_test_camera 1
wait 30
vr_dumpeye gate3_6dof_curl0_lat.ppm
wait 12
vr_test_camera 2
wait 30
vr_dumpeye gate3_6dof_curl0_top.ppm
wait 12

vr_hand_input_curl 0.5
vr_test_camera 1
wait 30
vr_dumpeye gate3_6dof_curl05_lat.ppm
wait 12
vr_test_camera 2
wait 30
vr_dumpeye gate3_6dof_curl05_top.ppm
wait 12

vr_hand_input_curl 1.0
vr_test_camera 1
wait 30
vr_dumpeye gate3_6dof_curl1_lat.ppm
wait 12
vr_test_camera 2
wait 30
vr_dumpeye gate3_6dof_curl1_top.ppm
wait 12

// Offhand 6DoF: not attached should follow the left controller.
vr_hand_input_curl 0.35
vr_test_camera_target 0
vr_test_camera_distance 55
vr_test_camera_aim 8
vr_test_camera_fov 90
vr_test_offhand_grip 0
vr_twohanded 0
vr_test_camera 1
wait 30
vr_dumpeye gate3_6dof_offhand_free.ppm
wait 12

// Offhand attached should snap to the foregrip.
vr_test_offhand_grip 1
vr_twohanded 1
wait 30
vr_dumpeye gate3_6dof_offhand_attached.ppm
wait 12

vr_test_camera 0
vr_test_offhand_grip 0
vr_twohanded 0
vr_primary_hand_model ""
vr_offhand_hand_model ""
vr_hand_profile rimrook
vr_hand_pose_source 0
vr_hand_input_curl 0.35
vr_hide_arms 1
vr_test_hands 0
wait 20
quit
