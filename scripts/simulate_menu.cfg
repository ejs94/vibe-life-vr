// ==============================================================================
// Xash3D VR - Automated 2D Menu Simulation Test Script
// ==============================================================================
// Tests laser pointer raycasting against floating menu quad, hovering over
// menu buttons, clicking "Hazard course", and launching the 3D VR level.
// ==============================================================================

wait 60

echo "=========================================================="
echo "  [VR SIMULATION] Starting 2D Menu Interaction Test...    "
echo "=========================================================="

// 1. Enable 6DoF hand simulation and pointer
vr_test_hands 1
vr_pointer_hud 1

// 2. Aim pointer at center of menu
vr_test_hand_pitch -7
vr_test_hand_yaw -7
wait 25
echo "[VR SIMULATION] Step 1: Eye 0 at menu center..."
vr_dumpeye vr_menu_01_center.ppm
wait 25

// 3. Aim pointer directly onto "Hazard course" button on the left panel
vr_test_hand_pitch -5
vr_test_hand_yaw -28
wait 25
echo "[VR SIMULATION] Step 2: Hovering on 'Hazard course' button (glow)..."
vr_dumpeye vr_menu_02_hover_button.ppm
wait 25

// 4. Click the button using simulated trigger pull
echo "[VR SIMULATION] Step 3: Clicking button via trigger pull..."
vr_test_click 1
wait 10
vr_test_click 0
wait 60

// 5. Capture game level loaded in 3D VR
echo "[VR SIMULATION] Step 4: Level loaded in 3D VR with laser sight..."
vr_dumpeye vr_menu_03_level_loaded.ppm
wait 30

echo "=========================================================="
echo "  [VR SIMULATION] 2D Menu Interaction Test Finished!      "
echo "=========================================================="
