// ==============================================================================
// Xash3D VR - Automated 2D Menu Simulation Test Script
// ==============================================================================
// Tests laser pointer raycasting against floating menu quad, hovering over
// menu buttons, clicking "Configuration", and navigating the options dialog.
// ==============================================================================

wait 60

echo "=========================================================="
echo "  [VR SIMULATION] Starting 2D Menu Interaction Test...    "
echo "=========================================================="

// 1. Enable 6DoF hand simulation and pointer
vr_test_hands 1
vr_pointer_hud 1

// 2. Aim pointer at center of menu
vr_test_hand_pitch -7
vr_test_hand_yaw -7
wait 25
echo "[VR SIMULATION] Step 1: Eye 0 at menu center..."
vr_dumpeye vr_menu_01_center.ppm
wait 25

// 3. Aim pointer directly onto "Configuration" button
// Yaw -28 deg and pitch 0 deg maps directly to Configuration (x ~ 430, y ~ 640)
vr_test_hand_pitch 0
vr_test_hand_yaw -28
wait 25
echo "[VR SIMULATION] Step 2: Hovering on 'Configuration' button..."
vr_dumpeye vr_menu_02_hover_config.ppm
wait 25

// 4. Click the "Configuration" button using simulated trigger pull
echo "[VR SIMULATION] Step 3: Clicking 'Configuration' button..."
vr_test_click 1
wait 10
vr_test_click 0
wait 35
echo "[VR SIMULATION] Step 4: Capturing Configuration sub-menu..."
vr_dumpeye vr_menu_03_config_screen.ppm
wait 35

// 5. Move pointer across Configuration dialog options
vr_test_hand_pitch -10
vr_test_hand_yaw -15
wait 25
echo "[VR SIMULATION] Step 5: Hovering inside Configuration dialog..."
vr_dumpeye vr_menu_04_config_dialog.ppm
wait 25

echo "=========================================================="
echo "  [VR SIMULATION] 2D Menu Interaction Test Finished!      "
echo "=========================================================="
