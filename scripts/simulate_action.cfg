// Comprehensive Automated Gameplay Simulation for Xash3D VR

// 1. Initial wait to ensure client connection and entity spawn
wait 120

echo "=========================================================="
echo "  [VR SIMULATION] Starting In-Game Controller Test...     "
echo "=========================================================="

// Audio settings
volume 1.0
s_volume 1.0
hisound 1

// Enable cheats, godmode, full weapons and ammo
god
impulse 101
give item_suit
give weapon_shotgun
give weapon_9mmAR
give weapon_crowbar

// Enable 6DoF hand simulation and laser sight
vr_test_hands 1
vr_lasersight 1
vr_test_hand_pitch 0
vr_test_hand_yaw 0

// 2. Equip Shotgun and WAIT for deploy animation (1.5 seconds = 85 frames)
use weapon_shotgun
wait 85

echo "[VR SIMULATION] Shotgun ready! Firing level blast..."
+attack
wait 20
-attack
wait 5
vr_dumpeye vr_01_shotgun_level.ppm
wait 40

// 3. Move weapon UP (-40 degrees) and fire
echo "[VR SIMULATION] Moving weapon UP (-40 degrees pitch)..."
vr_test_hand_pitch -40
wait 30
echo "[VR SIMULATION] Firing Shotgun UP into the sky!"
+attack
wait 20
-attack
wait 5
vr_dumpeye vr_02_shotgun_aim_up.ppm
wait 40

// 4. Move weapon DOWN (+40 degrees) and fire
echo "[VR SIMULATION] Moving weapon DOWN (+40 degrees pitch)..."
vr_test_hand_pitch 40
wait 30
echo "[VR SIMULATION] Firing Shotgun DOWN at the ground!"
+attack
wait 20
-attack
wait 5
vr_dumpeye vr_03_shotgun_aim_down.ppm
wait 40

// 5. Switch weapon to MP5 and wait for deploy animation (75 frames)
echo "[VR SIMULATION] Switching weapon to MP5..."
use weapon_9mmAR
vr_test_hand_pitch 0
wait 75

echo "[VR SIMULATION] MP5 ready! Firing burst..."
+attack
wait 35
-attack
wait 5
vr_dumpeye vr_04_mp5_level.ppm
wait 40

// 6. Aim MP5 UP and fire burst
echo "[VR SIMULATION] Moving MP5 UP (-35 degrees pitch)..."
vr_test_hand_pitch -35
wait 30
echo "[VR SIMULATION] Firing MP5 burst UP!"
+attack
wait 25
-attack
wait 5
vr_dumpeye vr_05_mp5_aim_up.ppm
wait 40

// 7. Switch to Crowbar and swing
echo "[VR SIMULATION] Switching weapon to Crowbar..."
use weapon_crowbar
vr_test_hand_pitch 0
wait 50

echo "[VR SIMULATION] Swinging Crowbar!"
+attack
wait 25
-attack
wait 5
vr_dumpeye vr_06_crowbar.ppm
wait 20

echo "=========================================================="
echo "  [VR SIMULATION] Complete Weapon & Pitch Test Finished!  "
echo "=========================================================="
