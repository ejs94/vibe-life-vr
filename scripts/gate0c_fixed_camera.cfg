// Gate 0c: fixed world comparison camera + baked-hand curling modes.
// Monado only. No Quest, no APK, no deploy.
echo "=== GATE 0C FIXED CAMERA ==="
map crossfire
wait 200
sv_cheats 1
give weapon_crossbow
give weapon_9mmhandgun
give weapon_9mmAR
vr_test_hands 1
vr_test_hand_pitch 0
vr_test_hand_yaw 0
vr_debug_hand 0
vr_lasersight 0
vr_headtorch 0
vr_debug_impacts 0
vr_weapon_true_depth 0
vr_grip_probe 1
vr_debug_hand_pose 1
vr_finger_curling 1
vr_test_finger_curl 0.5
vr_test_camera_fov 80
wait 90

// ---- Crossbow baked hand: curling off / index only / current ----
use weapon_crossbow
wait 150
vr_hide_arms 0
vr_hands_always_visible 0
vr_offhand_render 0
vr_test_camera_distance 60
vr_test_camera_aim 8

vr_baked_hand_curling 0
vr_test_camera 1
wait 30
vr_dumpeye gate0c_crossbow_hide0_curloff_lat.ppm
wait 12
vr_test_camera 2
wait 30
vr_dumpeye gate0c_crossbow_hide0_curloff_top.ppm
wait 12

vr_test_camera 1
vr_baked_hand_curling 2
wait 30
vr_dumpeye gate0c_crossbow_hide0_indexonly_lat.ppm
wait 12
vr_test_camera 2
wait 30
vr_dumpeye gate0c_crossbow_hide0_indexonly_top.ppm
wait 12

vr_test_camera 1
vr_baked_hand_curling 1
wait 30
vr_dumpeye gate0c_crossbow_hide0_current_lat.ppm
wait 12
vr_test_camera 2
wait 30
vr_dumpeye gate0c_crossbow_hide0_current_top.ppm
wait 12

// ---- Crossbow standalone Rimrook: baked hands stripped ----
vr_hide_arms 2
vr_hands_always_visible 1
vr_offhand_render 1
vr_baked_hand_curling 1
vr_test_camera 1
wait 30
vr_dumpeye gate0c_crossbow_hide2_current_lat.ppm
wait 12
vr_test_camera 2
wait 30
vr_dumpeye gate0c_crossbow_hide2_current_top.ppm
wait 12

// ---- Glock: current baked curling, lateral/top ----
use weapon_9mmhandgun
wait 150
vr_hide_arms 0
vr_hands_always_visible 0
vr_offhand_render 0
vr_baked_hand_curling 1
vr_test_camera_distance 28
vr_test_camera_aim 4
vr_test_camera 1
wait 30
vr_dumpeye gate0c_glock_hide0_current_lat.ppm
wait 12
vr_test_camera 2
wait 30
vr_dumpeye gate0c_glock_hide0_current_top.ppm
wait 12

// ---- MP5: current baked curling, lateral/top ----
use weapon_9mmAR
wait 150
vr_hide_arms 0
vr_hands_always_visible 0
vr_offhand_render 0
vr_baked_hand_curling 1
vr_test_camera_distance 34
vr_test_camera_aim 6
vr_test_camera 1
wait 30
vr_dumpeye gate0c_mp5_hide0_current_lat.ppm
wait 12
vr_test_camera 2
wait 30
vr_dumpeye gate0c_mp5_hide0_current_top.ppm
wait 12

// ---- reset ----
vr_test_camera 0
vr_baked_hand_curling 1
vr_hide_arms 1
vr_hands_always_visible 1
vr_offhand_render 1
vr_finger_curling 0
vr_grip_probe 0
vr_debug_hand_pose 0
vr_test_hands 0
wait 30
quit
