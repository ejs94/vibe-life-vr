// ==============================================================================
// Xash3D VR - Dedicated VR UI & Configuration Tabs Test Script
// Exercises all 4 tabs in CMenuVR, sliders, numeric inputs, and Beat Saber lasers
// ==============================================================================

snd_mute_losefocus 0
wait 30

echo "=========================================================="
echo "  [VR UI TEST] Initializing In-Headset VR Options Menu   "
echo "=========================================================="

menu_vr
wait 40

// --- Tab 0: Locomotion & Comfort ---
echo "  [VR UI TEST] Tab 0: Locomotion & Comfort"
vr_menu_tab 0
wait 20
vr_dumpeye ui_01_tab_locomotion.ppm
wait 15

// --- Tab 1: Weapons & Combat Ergonomics ---
echo "  [VR UI TEST] Tab 1: Weapons & Combat Ergonomics"
vr_menu_tab 1
wait 20
vr_dumpeye ui_02_tab_weapons.ppm
wait 15

// --- Tab 2: Immersion, Presence & Audio ---
echo "  [VR UI TEST] Tab 2: Immersion, Presence & Audio"
vr_menu_tab 2
wait 20
vr_dumpeye ui_03_tab_presence.ppm
wait 15

// --- Tab 3: VR Diagnostics & Runtime Debug ---
echo "  [VR UI TEST] Tab 3: VR Diagnostics & Runtime Debug"
vr_menu_tab 3
wait 20
vr_dumpeye ui_04_tab_debug.ppm
wait 15

// --- Interactive Tests: Beat Saber Alternating Laser Pointers ---
echo "  [VR UI TEST] Laser Pointer: Right Hand Beat Saber Ray"
vr_menu_tab 0
wait 15
vr_test_hands 1
vr_pointer_hud 1
vr_test_hand_pitch -6
vr_test_hand_yaw -12
wait 15
vr_test_click 1
wait 20
vr_dumpeye ui_05_laser_pointer_right.ppm
wait 10
vr_test_click 0
wait 15

echo "  [VR UI TEST] Laser Pointer: Left Hand Beat Saber Ray"
vr_test_click 2
wait 20
vr_dumpeye ui_06_laser_pointer_left.ppm
wait 10
vr_test_click 0
wait 15

// --- Interactive Tests: Slider Adjustments & Direct CVar Tweaks ---
echo "  [VR UI TEST] Slider & Control Adjustments"
vr_snap_angle 45
vr_worldscale 48
vr_weapon_pitchadjust -8
vr_height_adjust 5
vr_menu_distance 2.2
vr_menu_scale 1.8
wait 15
vr_menu_tab 2
wait 20
vr_dumpeye ui_07_sliders_adjusted.ppm
wait 15

// --- Interactive Tests: VR Debug Tab Actions ---
echo "  [VR UI TEST] VR Debug Actions (Clear Impacts & Reset Calibration)"
vr_menu_tab 3
wait 15
vr_record_impact
wait 10
vr_clear_impacts
wait 10
vr_dumpeye ui_08_debug_actions.ppm
wait 15

echo "=========================================================="
echo "  [VR UI TEST] UI Simulation Complete - Exiting Cleanly   "
echo "=========================================================="
wait 20
quit
