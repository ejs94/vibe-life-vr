map crossfire
wait 200
sv_cheats 1
give weapon_9mmhandgun
give weapon_crossbow
vr_test_hands 1
vr_test_hand_pitch 0
vr_test_hand_yaw 0
vr_hands_always_visible 1
vr_offhand_render 1
vr_finger_curling 0
vr_hand_profile auto
vr_hand_grip_lock 2
vr_test_camera_fov 60
vr_test_camera_target 1
vr_test_camera_distance 14
vr_test_camera_aim 0

// Glock baked close-up.
use weapon_9mmhandgun
wait 120
vr_hide_arms 0
vr_test_camera 1
wait 30
vr_dumpeye unified_glock_baked_lat.ppm
wait 12
vr_test_camera 2
wait 30
vr_dumpeye unified_glock_baked_top.ppm
wait 12

// Glock standalone MMOD close-up.
vr_hide_arms 2
vr_test_camera 1
wait 30
vr_dumpeye unified_glock_mmod_lat.ppm
wait 12
vr_test_camera 2
wait 30
vr_dumpeye unified_glock_mmod_top.ppm
wait 12

// Crossbow baked close-up.
use weapon_crossbow
wait 120
vr_hide_arms 0
vr_test_camera 1
wait 30
vr_dumpeye unified_crossbow_baked_lat.ppm
wait 12
vr_test_camera 2
wait 30
vr_dumpeye unified_crossbow_baked_top.ppm
wait 12

// Crossbow standalone MMOD close-up.
vr_hide_arms 2
vr_test_camera 1
wait 30
vr_dumpeye unified_crossbow_mmod_lat.ppm
wait 12
vr_test_camera 2
wait 30
vr_dumpeye unified_crossbow_mmod_top.ppm
wait 12

// Empty hand: same MMOD mesh at the controller.
use weapon_9mmhandgun
wait 120
r_drawviewmodel 0
vr_hide_arms 2
vr_offhand_render 0
vr_test_camera 1
wait 30
vr_dumpeye unified_empty_mmod_lat.ppm
wait 12
vr_test_camera 2
wait 30
vr_dumpeye unified_empty_mmod_top.ppm
wait 12

// Offhand free and attached use the same MMOD mesh.
r_drawviewmodel 1
vr_offhand_render 1
vr_hide_arms 0
vr_test_camera_target 0
vr_test_camera_distance 30
vr_test_camera_aim 5
vr_test_offhand_grip 0
vr_twohanded 0
vr_test_camera 1
wait 30
vr_dumpeye unified_offhand_free.ppm
wait 12
vr_test_offhand_grip 1
vr_twohanded 1
wait 30
vr_dumpeye unified_offhand_attached.ppm
wait 12

vr_test_camera 0
vr_test_offhand_grip 0
vr_twohanded 0
vr_hide_arms 0
vr_hand_grip_lock 1
vr_offhand_render 1
vr_test_hands 0
wait 20
quit
