// ==============================================================================
// Weapon hand replacement render check
// Holds the 9mm handgun and dumps the eye with the weapon's own glove hidden
// (vr_hide_arms 2) so the standalone Rimrook hand is drawn in its place.
// ==============================================================================

echo "=== WEAPON HAND REPLACEMENT CHECK ==="

vr_test_hands 1
vr_offhand_render 1
vr_finger_curling 1
vr_hands_always_visible 1
r_drawviewmodel 1

// Let the map finish spawning before the arsenal is handed out.
wait 120
impulse 101
wait 80
use weapon_9mmhandgun
wait 60

// Hold the weapon up in view and keep the test pose static so the two dumps
// capture the same camera.
vr_test_hand_pitch 20
vr_test_hand_yaw 25
vr_hide_arms 2
wait 40
vr_dumpeye weaponhand_hidden.ppm
wait 2

// Restore the vanilla glove for comparison.
vr_hide_arms 1
wait 4
vr_dumpeye weaponhand_vanilla.ppm

wait 10
quit
