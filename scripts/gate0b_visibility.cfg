// Gate 0b: investigate why the standalone Rimrook hand is not visible
// with a weapon, and capture the crossbow baked-hand close-ups.
// Monado only; no Quest, no APK.
echo "=== GATE 0B VISIBILITY ==="
map crossfire
wait 150
impulse 101
wait 60
vr_test_hands 1
vr_test_hand_pitch 0
vr_test_hand_yaw 0
vr_debug_hand 0
vr_lasersight 0
vr_headtorch 0
vr_debug_impacts 0
vr_weapon_true_depth 0
vr_hands_always_visible 1
vr_offhand_render 1
vr_hide_arms 2
vr_grip_probe 1
vr_debug_hand_pose 1
vr_finger_curling 1
vr_test_finger_curl 0.5
wait 90

// ---- no weapon: the hand layer must draw the standalone hand ----
r_drawviewmodel 0
wait 60
vr_dumpeye gate0b_rimrook_noweapon_y0.ppm
vr_test_hand_yaw 90
wait 15
vr_dumpeye gate0b_rimrook_noweapon_y90.ppm
vr_test_hand_yaw 0
vr_test_hand_pitch -35
wait 15
vr_dumpeye gate0b_rimrook_noweapon_pitchm35.ppm
vr_test_hand_pitch 35
wait 15
vr_dumpeye gate0b_rimrook_noweapon_pitchp35.ppm
vr_test_hand_pitch 0
r_drawviewmodel 1
wait 30

// ---- crossbow: standalone hand, then debug gizmo ----
use weapon_crossbow
wait 90
vr_hide_arms 2
wait 30
vr_dumpeye gate0b_rimrook_crossbow_y0.ppm
vr_test_hand_yaw 90
wait 15
vr_dumpeye gate0b_rimrook_crossbow_y90.ppm
vr_debug_hand 1
wait 20
vr_dumpeye gate0b_rimrook_crossbow_debug_y90.ppm
vr_debug_hand 0
vr_test_hand_yaw 0
wait 20

// ---- crossbow baked hand close-ups: curl 0 / 0.5 / 1 ----
vr_hide_arms 0
wait 30
vr_test_finger_curl 0
wait 15
vr_dumpeye gate0b_crossbow_baked_curl0_y0.ppm
vr_test_hand_yaw 90
wait 15
vr_dumpeye gate0b_crossbow_baked_curl0_y90.ppm
vr_test_hand_pitch -35
wait 15
vr_dumpeye gate0b_crossbow_baked_curl0_pitchm35.ppm
vr_test_hand_pitch 0
vr_test_finger_curl 0.5
wait 15
vr_dumpeye gate0b_crossbow_baked_curl05_y0.ppm
vr_test_hand_yaw 0
wait 15
vr_dumpeye gate0b_crossbow_baked_curl05_y0b.ppm
vr_test_hand_yaw 90
wait 15
vr_dumpeye gate0b_crossbow_baked_curl05_y90.ppm
vr_test_hand_pitch -35
wait 15
vr_dumpeye gate0b_crossbow_baked_curl05_pitchm35.ppm
vr_test_hand_pitch 0
vr_test_finger_curl 1
wait 15
vr_dumpeye gate0b_crossbow_baked_curl1_y0.ppm
vr_test_hand_yaw 0
wait 15
vr_dumpeye gate0b_crossbow_baked_curl1_y0b.ppm
vr_test_hand_yaw 90
wait 15
vr_dumpeye gate0b_crossbow_baked_curl1_y90.ppm
vr_test_hand_pitch -35
wait 15
vr_dumpeye gate0b_crossbow_baked_curl1_pitchm35.ppm

vr_grip_probe 0
vr_debug_hand_pose 0
vr_test_hands 0
vr_hide_arms 1
vr_finger_curling 0
wait 30
quit
