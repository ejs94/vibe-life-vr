// ==============================================================================
// Xash3D VR - Master End-to-End Regression Test Battery
// ==============================================================================

snd_mute_losefocus 0
wait 60

echo "=========================================================="
echo "  [VR TEST] Step 1: Querying VR CVars & CMenuVR Menu      "
echo "=========================================================="

vr_smoothturn
vr_snap_angle
vr_walkdirection
vr_lasersight
vr_headtorch
vr_twohanded
vr_lefthanded
vr_haptics_enabled
vr_pointer_hud
vr_weapon_pitchadjust
vr_worldscale
vr_height_adjust
vr_menu_distance
vr_menu_scale
vr_audio_hrtf
vr_offhand_render 0
vr_hide_arms 1

wait 30
echo "[VR TEST] Opening in-headset VR Options menu (menu_vr)..."
menu_vr
wait 40
vr_dumpeye regr_01_menu_vr_options.ppm
wait 20

echo "=========================================================="
echo "  [VR TEST] Step 2: Beat Saber Dual Alternating Lasers    "
echo "=========================================================="

vr_test_hands 1
vr_pointer_hud 1
vr_test_hand_pitch -5
vr_test_hand_yaw -10
wait 20

// 1. Right hand trigger click in menu -> switches active pointer to Right hand
echo "[VR TEST] Right hand trigger click in menu..."
vr_test_click 1
wait 15
vr_dumpeye regr_02_beatsaber_right.ppm
wait 10
vr_test_click 0
wait 20

// 2. Left hand trigger click in menu -> switches active pointer to Left hand (Beat Saber style)
echo "[VR TEST] Left hand trigger click in menu (alternates pointer)..."
vr_test_click 2
wait 15
vr_dumpeye regr_03_beatsaber_left.ppm
wait 10
vr_test_click 0
wait 20

echo "=========================================================="
echo "  [VR TEST] Step 3: Loading 3D Map for Gameplay Tests     "
echo "=========================================================="

map c1a0
wait 90

god
impulse 101
give item_suit
wait 30

vr_test_hands 1
vr_lasersight 1

echo "=========================================================="
echo "  [VR TEST] Step 4: Head Flashlight Temple Gesture        "
echo "=========================================================="

// Right hand temple click -> toggles flashlight ON
echo "[VR TEST] Right hand head gesture click (toggles flashlight ON)..."
vr_test_headgesture 1
vr_test_click 1
wait 20
vr_dumpeye regr_04_headtorch_on.ppm
wait 10
vr_test_click 0
vr_test_headgesture 0
wait 25

// Left hand temple click -> toggles flashlight OFF
echo "[VR TEST] Left hand head gesture click (toggles flashlight OFF)..."
vr_test_headgesture 2
vr_test_click 2
wait 20
vr_dumpeye regr_05_headtorch_off.ppm
wait 10
vr_test_click 0
vr_test_headgesture 0
wait 25

echo "=========================================================="
echo "  [VR TEST] Step 5: Orthonormal 6DoF Head Roll Matrix     "
echo "=========================================================="

vr_test_head 1
echo "[VR TEST] Head Roll Left (-25 deg)..."
vr_test_head_roll -25
wait 25
vr_dumpeye regr_06_head_roll_left.ppm
wait 15

echo "[VR TEST] Head Roll Right (+25 deg)..."
vr_test_head_roll 25
wait 25
vr_dumpeye regr_07_head_roll_right.ppm
wait 15

vr_test_head_roll 0
wait 15

echo "=========================================================="
echo "  [VR TEST] Step 6: 6DoF Muzzle Ballistics (Issue #14)    "
echo "=========================================================="

echo "[VR TEST] Testing MP5 Physical Muzzle Firing..."
use weapon_9mmAR
wait 60
+attack
wait 15
-attack
wait 15
vr_dumpeye regr_08_mp5_muzzle.ppm
wait 15

echo "[VR TEST] Testing Shotgun Barrel Muzzle Firing..."
use weapon_shotgun
wait 60
+attack2
wait 15
-attack2
wait 15
vr_dumpeye regr_09_shotgun_muzzle.ppm
wait 15

echo "[VR TEST] Testing Crossbow Bolt Muzzle Spawn..."
use weapon_crossbow
wait 60
+attack
wait 15
-attack
wait 15
vr_dumpeye regr_10_crossbow_muzzle.ppm
wait 15

echo "[VR TEST] Testing RPG Rocket Muzzle Spawn..."
use weapon_rpg
wait 60
+attack
wait 15
-attack
wait 25
vr_dumpeye regr_11_rpg_muzzle.ppm
wait 15

echo "=========================================================="
echo "  [VR TEST] Step 7: Physical Grenade Momentum (Issue #15) "
echo "=========================================================="

echo "[VR TEST] Testing Hand Grenade Physical Toss Momentum..."
use weapon_handgrenade
wait 60
+attack
wait 45
-attack
wait 25
vr_dumpeye regr_12_grenade_momentum.ppm
wait 20

echo "=========================================================="
echo "  [VR TEST] Step 8: Two-Handed Weapon Stabilization       "
echo "=========================================================="

echo "[VR TEST] Testing Two-Handed Weapon Stabilization..."
use weapon_9mmAR
wait 40
vr_twohanded 1
wait 25
vr_dumpeye regr_13_twohanded.ppm
wait 15
vr_twohanded 0

echo "=========================================================="
echo "  [VR TEST] Step 9: Skeletal Hands & Finger Curling       "
echo "=========================================================="

echo "[VR TEST] Testing Dynamic Skeletal Hands and Analog Finger Curling..."
use weapon_9mmhandgun
wait 35
vr_finger_curling 1
vr_offhand_render 1
vr_test_finger_curl 1
wait 35
vr_dumpeye regr_14_finger_curling.ppm
wait 15
vr_test_finger_curl 0
vr_offhand_render 0

echo "=========================================================="
echo "  [VR TEST] Master Regression Battery Completed!          "
echo "=========================================================="

wait 30
quit
