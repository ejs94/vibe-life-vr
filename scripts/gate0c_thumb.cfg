// Gate 0c thumb: standalone Rimrook thumb at curl 0 / 0.5 / 1.
// Weapon viewmodel is hidden so the hand is not occluded; the hand layer still
// draws the standalone palms. Monado only.
map crossfire
wait 200
sv_cheats 1
give weapon_crossbow
use weapon_crossbow
wait 150
vr_test_hands 1
vr_test_hand_pitch 0
vr_test_hand_yaw 0
vr_hide_arms 2
vr_hands_always_visible 1
vr_offhand_render 0
vr_baked_hand_curling 1
vr_thumb_curl_axis 1
r_drawviewmodel 0
vr_test_camera_distance 18
vr_test_camera_fov 65
vr_test_camera_aim 0
vr_test_camera_target 1

vr_test_camera 1
vr_finger_curling 0
wait 30
vr_dumpeye gate0c_thumb_curl0_lat.ppm
wait 12
vr_test_camera 2
wait 30
vr_dumpeye gate0c_thumb_curl0_top.ppm
wait 12

vr_finger_curling 1
vr_test_finger_curl 0.5
vr_test_camera 1
wait 30
vr_dumpeye gate0c_thumb_curl05_lat.ppm
wait 12
vr_test_camera 2
wait 30
vr_dumpeye gate0c_thumb_curl05_top.ppm
wait 12

vr_test_finger_curl 1
vr_test_camera 1
wait 30
vr_dumpeye gate0c_thumb_curl1_lat.ppm
wait 12
vr_test_camera 2
wait 30
vr_dumpeye gate0c_thumb_curl1_top.ppm
wait 12

// Legacy local-Y thumb axis at full curl, for comparison.
vr_thumb_curl_axis 0
vr_test_camera 1
wait 30
vr_dumpeye gate0c_thumb_legacyY_curl1_lat.ppm
wait 12
vr_test_camera 2
wait 30
vr_dumpeye gate0c_thumb_legacyY_curl1_top.ppm
wait 12

vr_test_camera 0
vr_finger_curling 0
vr_thumb_curl_axis 1
r_drawviewmodel 1
vr_hide_arms 1
vr_test_hands 0
wait 20
quit
