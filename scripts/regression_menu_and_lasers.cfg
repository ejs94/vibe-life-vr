// ==============================================================================
// Xash3D VR - Regression Test: Menu, Dual Lasers & VR Options
// ==============================================================================
wait 60
echo "[REGRESSION_TEST] 1. Initializing Menu and VR CVars..."

// Query all VR CVars to verify registration and values
vr_smoothturn
vr_snap_angle
vr_walkdirection
vr_lasersight
vr_headtorch
vr_twohanded
vr_lefthanded
vr_haptics_enabled
vr_pointer_hud
vr_weapon_pitchadjust
vr_worldscale
vr_height_adjust
vr_menu_distance
vr_menu_scale

wait 30
echo "[REGRESSION_TEST] 2. Activating VR Options Menu via menu_vr..."
menu_vr
wait 45
vr_dumpeye regr_01_menu_vr_options.ppm
wait 20

echo "[REGRESSION_TEST] 3. Testing Dual Alternating Laser Pointers (Beat Saber style)..."
vr_test_hands 1
vr_test_hand_yaw 0
vr_test_hand_pitch 0
wait 30

// Simulate left hand trigger click
echo "[REGRESSION_TEST] Simulating LEFT hand trigger click..."
vr_test_click 2
wait 30
vr_test_click 0
wait 20
vr_dumpeye regr_02_laser_left_active.ppm
wait 20

// Simulate right hand trigger click
echo "[REGRESSION_TEST] Simulating RIGHT hand trigger click..."
vr_test_click 1
wait 30
vr_test_click 0
wait 20
vr_dumpeye regr_03_laser_right_active.ppm
wait 20

echo "[REGRESSION_TEST] Menu and Laser regression test completed successfully!"
wait 30
quit
