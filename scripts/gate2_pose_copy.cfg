// Gate 2: baked hand authority and standalone pose copy.
// Monado only. No Quest, no APK, no deploy.
map crossfire
wait 200
sv_cheats 1
give weapon_crossbow
give weapon_9mmhandgun
give weapon_9mmAR
vr_test_hands 1
vr_test_hand_pitch 0
vr_test_hand_yaw 0
vr_debug_hand 0
vr_lasersight 0
vr_headtorch 0
vr_debug_impacts 0
vr_weapon_true_depth 0
vr_hands_always_visible 1
vr_offhand_render 1
vr_finger_curling 0
vr_test_camera_fov 80
vr_test_camera_distance 60
vr_test_camera_aim 8
vr_test_camera_target 0
wait 90

use weapon_crossbow
wait 150

// Baked hand baseline.
vr_hide_arms 0
vr_hand_pose_source 0
vr_test_camera 1
wait 30
vr_dumpeye gate2_crossbow_hide0_lat.ppm
wait 12
vr_test_camera 2
wait 30
vr_dumpeye gate2_crossbow_hide0_top.ppm
wait 12

// Standalone hand, controller pose.
vr_hide_arms 2
vr_hand_pose_source 0
vr_test_camera 1
wait 30
vr_dumpeye gate2_crossbow_hide2_src0_lat.ppm
wait 12
vr_test_camera 2
wait 30
vr_dumpeye gate2_crossbow_hide2_src0_top.ppm
wait 12

// Standalone hand, baked pose copy.
vr_hand_pose_source 1
vr_hand_anim_blend 1.0
vr_test_camera 1
wait 30
vr_dumpeye gate2_crossbow_hide2_src1_lat.ppm
wait 12
vr_test_camera 2
wait 30
vr_dumpeye gate2_crossbow_hide2_src1_top.ppm
wait 12

// Hand close-up at the grip.
vr_test_camera_target 1
vr_test_camera_distance 18
vr_test_camera_aim 0
vr_test_camera 1
wait 30
vr_dumpeye gate2_crossbow_hide2_src1_hand_lat.ppm
wait 12
vr_test_camera 2
wait 30
vr_dumpeye gate2_crossbow_hide2_src1_hand_top.ppm
wait 12

// Glock fallback pose copy, whole weapon.
use weapon_9mmhandgun
wait 150
vr_test_camera_target 0
vr_test_camera_distance 28
vr_test_camera_aim 4
vr_test_camera 1
wait 30
vr_dumpeye gate2_glock_hide2_src1_lat.ppm
wait 12
vr_test_camera 2
wait 30
vr_dumpeye gate2_glock_hide2_src1_top.ppm
wait 12

// MP5 fallback pose copy, whole weapon.
use weapon_9mmAR
wait 150
vr_test_camera_distance 34
vr_test_camera_aim 6
vr_test_camera 1
wait 30
vr_dumpeye gate2_mp5_hide2_src1_lat.ppm
wait 12
vr_test_camera 2
wait 30
vr_dumpeye gate2_mp5_hide2_src1_top.ppm
wait 12

vr_test_camera 0
vr_hand_pose_source 0
vr_hand_anim_blend 1.0
vr_hide_arms 1
vr_finger_curling 0
vr_test_hands 0
wait 20
quit
