// Clean fixed-camera evidence in the generated testbed_scale map.
// Monado only. No Quest, no APK, no deploy.
echo "=== TESTBED SCALE HANDS ==="
map testbed_scale
wait 240
sv_cheats 1
give weapon_9mmhandgun
give weapon_crossbow
give weapon_9mmAR
vr_test_hands 1
vr_hands_always_visible 1
vr_offhand_render 1
vr_finger_curling 0
vr_hand_profile auto
vr_debug_hand_pose 1
vr_test_camera_fov 70
vr_test_camera_distance 60
vr_test_camera_aim 6
vr_test_camera_target 0
vr_hide_arms 0
vr_holster 0
wait 120

// 1) Baked dominant hand on a pistol, fixed lateral and front cameras.
use weapon_9mmhandgun
wait 150
vr_hide_arms 0
vr_test_camera 1
wait 40
vr_dumpeye gate_testbed_glock_baked_lat.ppm
wait 12
vr_test_camera 3
wait 40
vr_dumpeye gate_testbed_glock_baked_front.ppm
wait 12

// 2) Baked support hand on the crossbow (two-handed viewmodel).
use weapon_crossbow
wait 150
vr_hide_arms 0
vr_test_camera_target 0
vr_test_camera_distance 70
vr_test_camera_aim 8
vr_test_camera 3
wait 40
vr_dumpeye gate_testbed_crossbow_baked_support.ppm
wait 12
vr_test_camera 4
wait 40
vr_dumpeye gate_testbed_crossbow_baked_support_left.ppm
wait 12

// 3) Free offhand blocky at the controller, weapon viewmodel stripped.
vr_hide_arms 2
vr_test_camera_target 2
vr_test_camera_distance 55
vr_test_camera_aim 0
vr_test_camera 3
wait 40
vr_dumpeye gate_testbed_crossbow_free_offhand_fixed.ppm
wait 12
vr_test_camera 0
vr_test_camera_target 0
wait 40
vr_dumpeye gate_testbed_crossbow_free_offhand_eye.ppm
wait 12

// 4) Unarmed blocky hand, normal eye camera, weapon holstered.
vr_holster 1
vr_hide_arms 2
vr_test_camera 0
vr_test_camera_target 0
wait 60
vr_dumpeye gate_testbed_unarmed_block.ppm
wait 12

// reset
vr_holster 0
vr_hide_arms 0
vr_test_camera 0
vr_test_camera_target 0
vr_debug_hand_pose 0
vr_test_hands 0
wait 20
quit
