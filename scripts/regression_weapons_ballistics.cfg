// ==============================================================================
// Xash3D VR - Regression Test: 6DoF Weapons, Muzzle Ballistics & Head Gesture
// ==============================================================================
wait 70
echo "[REGRESSION_TEST] 1. Equipping full arsenal and setting up VR simulation..."

god
give item_suit
impulse 101

vr_test_hands 1
vr_lasersight 1
vr_test_hand_pitch 0
vr_test_hand_yaw 0

vr_test_head 1
vr_test_head_pitch 0
vr_test_head_yaw 0
vr_test_head_roll 0

wait 30

// ==============================================================================
// Test 1: Head-Mounted Flashlight & 6DoF Temple Gesture (HL2:VR style)
// ==============================================================================
echo "[REGRESSION_TEST] 2. Testing Head Flashlight Temple Gesture..."
vr_test_headgesture 1
wait 35
vr_dumpeye regr_04_headtorch_on.ppm
wait 20
vr_test_headgesture 2
wait 35
vr_dumpeye regr_05_headtorch_off.ppm
wait 20

// ==============================================================================
// Test 2: Orthonormal Singularity-Free Head Roll Matrix
// ==============================================================================
echo "[REGRESSION_TEST] 3. Testing 6DoF Head Roll (Left -25 deg, Right +25 deg)..."
vr_test_head_roll -25
wait 30
vr_dumpeye regr_06_head_roll_left.ppm
wait 20
vr_test_head_roll 25
wait 30
vr_dumpeye regr_07_head_roll_right.ppm
wait 20
vr_test_head_roll 0
wait 20

// ==============================================================================
// Test 3: MP5 Viewmodel & Physical Muzzle Ballistics
// ==============================================================================
echo "[REGRESSION_TEST] 4. Testing MP5 Physical Muzzle Firing..."
use weapon_9mmAR
wait 40
+attack
wait 15
-attack
wait 20
vr_dumpeye regr_08_mp5_fire.ppm
wait 20

// ==============================================================================
// Test 4: Shotgun Barrel Muzzle Firing
// ==============================================================================
echo "[REGRESSION_TEST] 5. Testing Shotgun Double-Barrel Fire..."
use weapon_shotgun
wait 40
+attack2
wait 15
-attack2
wait 20
vr_dumpeye regr_09_shotgun_fire.ppm
wait 20

// ==============================================================================
// Test 5: Python .357 Handgun Laser & Ballistics
// ==============================================================================
echo "[REGRESSION_TEST] 6. Testing Python .357 Handgun Fire..."
use weapon_357
wait 40
+attack
wait 15
-attack
wait 20
vr_dumpeye regr_10_python_fire.ppm
wait 20

// ==============================================================================
// Test 6: Crossbow Bolt Spawn from Muzzle
// ==============================================================================
echo "[REGRESSION_TEST] 7. Testing Crossbow Bolt Spawn..."
use weapon_crossbow
wait 40
+attack
wait 15
-attack
wait 20
vr_dumpeye regr_11_crossbow_fire.ppm
wait 20

// ==============================================================================
// Test 7: RPG Rocket Launch from 6DoF Muzzle
// ==============================================================================
echo "[REGRESSION_TEST] 8. Testing RPG Rocket Launch..."
use weapon_rpg
wait 50
+attack
wait 15
-attack
wait 25
vr_dumpeye regr_12_rpg_rocket.ppm
wait 20

// ==============================================================================
// Test 8: Physical Grenade Toss with In-Flight Momentum
// ==============================================================================
echo "[REGRESSION_TEST] 9. Testing Hand Grenade Physical Toss Momentum..."
use weapon_handgrenade
wait 40
+attack
wait 45
-attack
wait 25
vr_dumpeye regr_13_grenade_toss.ppm
wait 20

// ==============================================================================
// Test 9: Two-Handed Weapon Grip Stabilization
// ==============================================================================
echo "[REGRESSION_TEST] 10. Testing Two-Handed Weapon Grip Stabilization..."
use weapon_9mmAR
wait 30
vr_twohanded 1
wait 30
vr_dumpeye regr_14_twohanded_active.ppm
wait 20

echo "[REGRESSION_TEST] All 6DoF Weapon and Ballistics tests completed successfully!"
wait 30
quit
