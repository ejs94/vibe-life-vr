// R2 roll-alignment probe template.
// scripts/test_roll_alignment.sh substitutes @ROLL@ (wrist roll in degrees)
// and writes the result to out/roll_probe.cfg and out/valve/roll_probe.cfg.
// Only @ROLL@ is substituted; every other value is fixed on purpose so the
// four runs differ by wrist roll alone.
sv_cheats 1
map crossfire
wait 180
vr_native_weapons 1
vr_test_hands 1
vr_test_hand_pitch 0
vr_test_hand_yaw 0
vr_test_hand_roll @ROLL@
vr_test_hand_offset "0 0 0"
vr_test_head 1
vr_test_head_pitch 0
vr_test_head_yaw 0
vr_test_head_roll 0
vr_lasersight 1
vr_debug_impacts 0
vr_hide_arms 0
impulse 101
wait 40
use weapon_9mmhandgun
wait 90
+attack
wait 8
-attack
wait 30
quit
