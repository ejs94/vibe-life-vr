// ============================================================================
// Vibe-Life VR — manual reload vertical slice
// ============================================================================
// Equips the Glock, fires one round, then advances the three reload stages:
// eject magazine, insert fresh magazine, rack the slide. The server emits
// [VR_RELOAD] markers consumed by scripts/test_manual_reload.sh.

echo "=== VIBE-LIFE MANUAL RELOAD TEST ==="

vr_manual_reload 1
vr_debug_reload 1
vr_test_hands 1
vr_test_hand_pitch 0
vr_test_hand_yaw 0

wait 200
impulse 101
wait 120
use weapon_9mmhandgun
wait 60

// Spend one round so the manual reload is allowed on a full clip.
vr_test_click 1
wait 20
vr_test_click 0
wait 80

echo "--- eject ---"
vr_test_btn_reload 1
wait 30
vr_test_btn_reload 0
wait 120

echo "--- insert ---"
vr_test_btn_reload 1
wait 30
vr_test_btn_reload 0
wait 120

echo "--- rack ---"
vr_test_btn_reload 1
wait 30
vr_test_btn_reload 0
wait 120

quit
