// Gate 0: baked MMOD hand vs standalone Rimrook hand on the real weapon.
// Run under Monado only. No Quest, no APK.
echo "=== GATE 0 HANDS ==="
map crossfire
wait 150
vr_test_hands 1
vr_test_hand_pitch 0
vr_test_hand_yaw 0
vr_debug_hand 0
vr_lasersight 0
vr_headtorch 0
vr_debug_impacts 0
vr_offhand_render 0
vr_weapon_true_depth 0
vr_grip_probe 1
vr_debug_hand_pose 1
vr_finger_curling 1
vr_test_finger_curl 0.5
wait 90
impulse 101
wait 90

// ---- crossbow ----
use weapon_crossbow
wait 90
vr_hide_arms 0
wait 30
vr_dumpeye gate0_crossbow_hide0_y0.ppm
vr_test_hand_yaw 90
wait 12
vr_dumpeye gate0_crossbow_hide0_y90.ppm
