// ============================================================================
// Vibe-Life VR — weapon grip calibration pass
// ============================================================================
// Run with vr_grip_probe 2 and vr_test_hands 1, then feed the engine log to
// scripts/calibrate_weapon_grips.py. The script derives grip_offset from the
// animated right-hand bone and the crossbow foregrip from the "grip" landmark.
// This file intentionally does not dump screenshots; it only produces the
// [VR_GRIP_BONE] / [VR_GRIP_BONES] telemetry consumed by the calibration tool.

echo "=== VIBE-LIFE WEAPON GRIP CALIBRATION ==="

vr_test_hands 1
vr_test_hand_pitch 0
vr_test_hand_yaw 0
vr_hide_arms 1
vr_offhand_render 0
vr_weapon_pullback 0
vr_weapon_true_depth 0
vr_grip_probe 2

wait 200
impulse 101
wait 120

use weapon_crowbar
wait 300
use weapon_9mmhandgun
wait 300
use weapon_357
wait 300
use weapon_9mmAR
wait 300
use weapon_shotgun
wait 300
use weapon_crossbow
wait 300
use weapon_rpg
wait 300
use weapon_gauss
wait 300
use weapon_egon
wait 300
use weapon_hornetgun
wait 300
use weapon_handgrenade
wait 300
use weapon_tripmine
wait 300
use weapon_satchel
wait 300
use weapon_snark
wait 300

quit
